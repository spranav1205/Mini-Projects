# Retirement Planning Configuration Example
# Copy this file and customize it for your specific scenario

[scenario]
# Scenario name for identification
name = My Retirement Plan
# Description of this scenario
description = Conservative retirement planning with balanced portfolio

[portfolio]
# Initial corpus in rupees (e.g., 10000000 = 1 crore)
initial_corpus = 10000000

# Market parameters: expected_return, volatility (annual, as decimals)
# Presets: equity, optimistic_equity, balanced_60_40, conservative_30_70, gov_bonds, cash
# Or specify custom: market_return = 0.09, market_volatility = 0.12
market_preset = optimistic_equity
# Uncomment to use custom values instead:
# market_return = 0.09
# market_volatility = 0.12

# Inflation parameters: expected_inflation, volatility (annual, as decimals)
# Presets: low, base, high
# Or specify custom: inflation_rate = 0.052, inflation_volatility = 0.020
inflation_preset = base
# Uncomment to use custom values instead:
# inflation_rate = 0.052
# inflation_volatility = 0.020

# Tax rate on withdrawals (as decimal, e.g., 0.125 = 12.5%)
tax_rate = 0.125

[withdrawal]
# Withdrawal strategy: fixed, percentage, or dynamic
strategy = fixed

# --- Fixed Strategy Parameters ---
# Monthly withdrawal amount (in rupees)
monthly_amount = 30000
# Annual lump sum withdrawal (in rupees, e.g., for vacation, insurance)
annual_lump_sum = 100000
# Annual increment beyond inflation (as decimal, e.g., 0.02 = 2% real increase)
annual_increment = 0.00
# Grace period before first withdrawal (in months)
grace_period_months = 5

# --- Percentage Strategy Parameters ---
# (Used only if strategy = percentage)
# annual_percentage = 4.0

# --- Dynamic Strategy Parameters ---
# (Used only if strategy = dynamic)
# min_withdrawal = 80000
# max_withdrawal = 200000
# target_percentage = 4.0

[simulation]
# Number of years to simulate
years = 10
# Additional months beyond full years
months = 0
# Number of Monte Carlo runs
runs = 1000
# Confidence level for intervals (as decimal, e.g., 0.90 = 90%)
confidence = 0.90

[output]
# Generate annual traces plot (yes/no)
plot_traces = yes
# Generate corpus histogram (yes/no)
plot_histogram = yes
# Year for histogram (integer)
histogram_year = 5
# Generate withdrawal analysis plot (yes/no)
plot_withdrawal = yes
# Save plots to disk (yes/no)
save_plots = yes
# Directory to save plots
plots_dir = plots
# Optional filename prefix for saved plots (blank uses scenario name)
plots_prefix =
# Export results to CSV (yes/no)
export_csv = no
# CSV filename (if export_csv = yes)
csv_filename = retirement_results.csv
